server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: suppkart-backend
    
  profiles:
    active: dev
    
  datasource:
    url: jdbc:h2:mem:suppkart_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  h2:
    console:
      enabled: true
      path: /h2-console
        
  redis:
    host: localhost
    port: 6379
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        
  cache:
    type: redis
    redis:
      time-to-live: 30m
      
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
              
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:suppkart-secret-key-for-jwt-token-generation-should-be-at-least-32-characters-long}
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days in milliseconds
  
  cart:
    guest-expiration-days: 7
    
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_your_key_id}
      key-secret: ${RAZORPAY_KEY_SECRET:your_key_secret}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}
      api-url: https://api.razorpay.com/v1
    phonepe:
      merchant-id: ${PHONEPE_MERCHANT_ID:your_merchant_id}
      salt-key: ${PHONEPE_SALT_KEY:your_salt_key}
      api-url: https://api.phonepe.com/apis/hermes
    
  cors:
    allowed-origins: 
      - http://localhost:3000
      - http://localhost:3001
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

logging:
  level:
    com.suppkart: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO
    
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
