# File Upload Configuration
app:
  file-upload:
    upload-dir: uploads/products
    base-url: http://localhost:8080
    max-file-size: 5242880  # 5MB in bytes
    max-request-size: 52428800  # 50MB in bytes
    allowed-image-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
    allowed-video-types:
      - video/mp4
      - video/webm

# Spring Boot file upload settings
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
      enabled: true